[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser tests that require a running application and Chrome",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
exclude = ["scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
