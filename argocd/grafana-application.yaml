apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgb-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      releaseName: lgb-grafana
      values: |
        admin:
          existingSecret: lgb-grafana-admin
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        service:
          type: ClusterIP
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://lgb-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
                editable: false
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: local-guide-booking
                orgId: 1
                folder: Local Guide Booking
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/local-guide-booking
        dashboards:
          local-guide-booking:
            overview:
              json: |
                {
                  "uid": "local-guide-booking-overview",
                  "title": "Local Guide Booking Overview",
                  "tags": ["local-guide-booking", "devsecops"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 1,
                  "refresh": "15s",
                  "panels": [
                    {
                      "id": 1,
                      "type": "timeseries",
                      "title": "HTTP Request Rate",
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(rate(lgb_http_requests_total[5m]))", "legendFormat": "requests / second"}],
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
                    },
                    {
                      "id": 2,
                      "type": "timeseries",
                      "title": "p95 HTTP Latency",
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                      "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(lgb_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95"}],
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
                    },
                    {
                      "id": 3,
                      "type": "timeseries",
                      "title": "HTTP 5xx Error Rate",
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
                      "targets": [{"refId": "A", "expr": "sum(rate(lgb_http_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "5xx / second"}],
                      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
                    },
                    {
                      "id": 4,
                      "type": "timeseries",
                      "title": "Booking Transitions",
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum by (to_status) (rate(lgb_bookings_transitions_total[5m]))"}],
                      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
                    }
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
