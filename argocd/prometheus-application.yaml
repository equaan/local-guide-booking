apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgb-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.37.0
    helm:
      releaseName: lgb-prometheus
      values: |
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          persistentVolume:
            enabled: false
          retention: 24h
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
        extraScrapeConfigs: |
          - job_name: local-guide-booking
            metrics_path: /metrics
            static_configs:
              - targets:
                  - local-guide-booking.lgb-dev.svc.cluster.local:8000
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
