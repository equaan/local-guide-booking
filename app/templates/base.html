<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Local Guide Booking{% endblock %}</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="/" aria-label="Local Guide Booking home">Local Guide Booking</a>
        <a href="/slots" data-testid="nav-slots">Browse slots</a>
        <a href="/login" data-testid="nav-login">Log in</a>
        <a href="/register" data-testid="nav-register">Register</a>
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash-{{ category }}" data-testid="flash">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
