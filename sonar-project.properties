# core Project Configuration
sonar.projectKey=local-guide-booking
sonar.projectName=Local Guide Booking
sonar.projectVersion=1.0.0

# Path to source and test files
sonar.sources=app
sonar.tests=tests

# Code Execution & Test Reports Paths
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results/pytest.xml

# Exclusions to Focus Analysis purely on APP code
# Excludes local virtual environments, pytest caches, and Alembic/Flask migration scripts
sonar.exclusions=**/.venv-ci/**, **/.venv/**, **/migrations/**, **/.pytest_cache/**, **/test-results/**