apiVersion: apps/v1
kind: Deployment
metadata:  
  name: local-guide-booking
  namespace: lgb-dev
  labels:
    app: local-guide-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-guide-booking
  template:
    metadata:
      labels:
        app: local-guide-booking
    spec:
      containers:
        - name: flask-app
          image: local-guide-booking:v0.1.0
          imagePullPolicy: Never #Forces Kubernetes to Look for the local docker desktop image
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "dev"
          livenessProbe: 
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      
---
apiVersion: v1
kind: Service
metadata: 
  name: local-guide-booking-svc
  namespace: lgb-dev
spec: 
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: local-guide-booking
            
